<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1080px}
.tile{position:relative;width:1080px;height:1080px;background:linear-gradient(160deg,#2f66f5 0%,#1d4ed8 55%,#1a3fb8 100%);overflow:hidden}
.s{position:absolute;left:0;right:0;top:50%;transform:translate(-14px,-53%);text-align:center;font:800 700px/1 'Plus Jakarta Sans',sans-serif;color:#fff;letter-spacing:-20px}
.dot{position:absolute;width:118px;height:118px;border-radius:50%;background:#ffc93c;left:700px;top:228px}
</style></head><body><div class="tile"><div class="s">S</div><div class="dot"></div></div></body></html>
